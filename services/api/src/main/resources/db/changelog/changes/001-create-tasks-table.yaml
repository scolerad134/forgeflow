databaseChangeLog:
  - changeSet:
      id: 001-create-tasks-table
      author: forgeflow
      changes:
        - createTable:
            tableName: tasks
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: payload
                  type: JSONB

              - column:
                  name: result
                  type: JSONB

              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: started_at
                  type: TIMESTAMP

              - column:
                  name: finished_at
                  type: TIMESTAMP